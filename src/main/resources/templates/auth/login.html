<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — You_can JECRC Placement Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="d-flex align-items-center justify-content-center py-5" style="min-height: 100vh; background: radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.08) 0%, rgba(168, 29, 34, 0.06) 90%);">

    <div class="container" style="max-width: 460px;">
        <!-- Logo / Title -->
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-4 shadow-sm mb-2" style="width: 3.5rem; height: 3.5rem;">
                <i class="bi bi-mortarboard-fill fs-2"></i>
            </div>
            <h2 class="brand-font fw-bold mb-1">You_can</h2>
            <div class="text-muted small">JECRC UNIVERSITY PLACEMENT PORTAL</div>
        </div>

        <!-- Login Card -->
        <div class="app-card p-4 p-sm-5 shadow-lg">
            <h4 class="fw-bold mb-1">Sign in to your account</h4>
            <p class="text-muted small mb-4">Use your university email address to access recruitment history and prep tools.</p>

            <!-- Alerts -->
            <div class="alert alert-danger py-2 small" th:if="${errorMessage}" th:text="${errorMessage}">Invalid credentials</div>
            <div class="alert alert-success py-2 small" th:if="${successMessage}" th:text="${successMessage}">Success</div>

            <!-- Form -->
            <form id="loginForm" th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label small fw-semibold" for="emailInput">University Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control border-start-0 ps-0" id="emailInput" name="email" placeholder="name@jecrcu.edu.in" required autofocus>
                    </div>
                </div>

                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label class="form-label small fw-semibold mb-0" for="passwordInput">Password</label>
                        <a th:href="@{/forgot-password}" class="small text-muted text-decoration-none">Forgot?</a>
                    </div>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control border-start-0 ps-0" id="passwordInput" name="password" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mt-2">Sign In</button>
            </form>

            <!-- 1-Click Demo Logins for Instant Testing -->
            <div class="mt-4 pt-3 border-top">
                <div class="text-muted small text-center mb-2 fw-semibold">⚡ One-Click Demo Access</div>
                <div class="d-grid gap-2">
                    <button type="button" class="btn btn-sm btn-outline-primary d-flex align-items-center justify-content-between px-3"
                            onclick="fillDemoLogin('admin@jecrcu.edu.in', 'admin123')">
                        <span><i class="bi bi-shield-lock-fill me-1 text-danger"></i> Placement Admin</span>
                        <code class="small text-muted">admin123</code>
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-secondary d-flex align-items-center justify-content-between px-3"
                            onclick="fillDemoLogin('rahul.sharma@jecrcu.edu.in', 'student123')">
                        <span><i class="bi bi-person-fill me-1 text-primary"></i> Pre-final Student</span>
                        <code class="small text-muted">student123</code>
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-secondary d-flex align-items-center justify-content-between px-3"
                            onclick="fillDemoLogin('alumni.amit@jecrcu.edu.in', 'mentor123')">
                        <span><i class="bi bi-award-fill me-1 text-warning"></i> Placed Alumnus (Microsoft)</span>
                        <code class="small text-muted">mentor123</code>
                    </button>
                </div>
            </div>

            <div class="text-center mt-4 text-muted small">
                Don't have an account? <a th:href="@{/register}" class="fw-semibold">Register with university ID</a>
            </div>
        </div>

        <div class="text-center mt-4">
            <button class="btn btn-sm btn-link text-muted text-decoration-none" id="themeToggleBtn" type="button">
                <i class="bi bi-moon-stars-fill me-1" id="themeToggleIcon"></i> Switch Theme
            </button>
        </div>
    </div>

    <script th:src="@{/js/app.js}"></script>
</body>
</html>
