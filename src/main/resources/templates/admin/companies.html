<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: html}">
<head>
    <title>Manage Companies — You_can Admin</title>
</head>
<body>
<div th:fragment="content">
    <div class="container">

        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <a th:href="@{/admin}" class="text-decoration-none small text-muted">&larr; Back to Admin Dashboard</a>
                <h3 class="fw-bold mb-1 mt-1">Manage Campus Recruiters</h3>
                <p class="text-muted small mb-0">Add, edit, or remove participating campus recruitment companies.</p>
            </div>
            <button class="btn btn-sm btn-primary rounded-pill px-3" data-bs-toggle="collapse" data-bs-target="#newCompanyCollapse">
                <i class="bi bi-plus-lg me-1"></i> Add New Recruiter
            </button>
        </div>

        <!-- Add Company Form Collapse -->
        <div class="collapse mb-4" id="newCompanyCollapse">
            <div class="app-card p-4 shadow-sm border-primary">
                <h5 class="fw-bold mb-3"><i class="bi bi-building-add text-primary me-2"></i>Add / Edit Company</h5>
                <form th:action="@{/admin/companies/save}" method="post">
                    <input type="hidden" name="id" id="editCompanyId">

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Company Name</label>
                            <input type="text" class="form-control" name="name" id="editCompanyName" placeholder="e.g. Adobe" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Industry</label>
                            <input type="text" class="form-control" name="industry" id="editCompanyIndustry" placeholder="e.g. Product & Tech, IT Services, Consulting" required>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold">Placement Tier</label>
                            <select class="form-select" name="tier" id="editCompanyTier">
                                <option value="Super Dream">Super Dream (&gt; 20 LPA)</option>
                                <option value="Dream">Dream (10 - 20 LPA)</option>
                                <option value="Mass & Elite" selected>Mass &amp; Elite (5 - 10 LPA)</option>
                                <option value="Core & IT">Core &amp; IT (&lt; 5 LPA)</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold">Careers Website</label>
                            <input type="url" class="form-control" name="website" id="editCompanyWebsite" placeholder="https://careers.company.com">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold">Logo Image URL</label>
                            <input type="url" class="form-control" name="logoUrl" id="editCompanyLogo" placeholder="https://.../logo.svg">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Company Description</label>
                        <textarea class="form-control" name="description" id="editCompanyDesc" rows="2" placeholder="Brief overview of the recruiter..."></textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <button type="button" class="btn btn-sm btn-secondary" data-bs-toggle="collapse" data-bs-target="#newCompanyCollapse">Cancel</button>
                        <button type="submit" class="btn btn-sm btn-primary px-4 fw-semibold">Save Recruiter</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Companies Table -->
        <div class="app-card p-4 shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light small">
                        <tr>
                            <th>Recruiter</th>
                            <th>Industry</th>
                            <th>Tier</th>
                            <th>Recorded Visits</th>
                            <th>Website</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="c : ${companies}">
                            <td>
                                <div class="d-flex align-items-center gap-2">
                                    <div class="company-logo-frame flex-shrink-0" style="width: 2.2rem; height: 2.2rem;">
                                        <img th:if="${c.logoUrl != null and !c.logoUrl.isBlank()}" th:src="${c.logoUrl}" th:alt="${c.name}">
                                        <span th:if="${c.logoUrl == null or c.logoUrl.isBlank()}" class="fw-bold text-primary" th:text="${#strings.substring(c.name, 0, 1)}">C</span>
                                    </div>
                                    <strong class="text-primary" th:text="${c.name}">Google</strong>
                                </div>
                            </td>
                            <td th:text="${c.industry}">Product &amp; Tech</td>
                            <td><span class="badge badge-soft-warning" th:text="${c.tier}">Super Dream</span></td>
                            <td><span class="badge badge-soft-primary" th:text="${c.drives.size() + ' visits'}">2 visits</span></td>
                            <td>
                                <a th:if="${c.website}" th:href="${c.website}" target="_blank" class="small text-muted text-decoration-none">
                                    <i class="bi bi-box-arrow-up-right me-1"></i> Visit
                                </a>
                                <span th:if="${c.website == null}" class="text-muted small">N/A</span>
                            </td>
                            <td class="text-end">
                                <div class="d-inline-flex gap-1">
                                    <a th:href="@{'/companies/' + ${c.id}}" class="btn btn-sm btn-outline-secondary py-1 px-2" title="View Public Page">
                                        <i class="bi bi-eye"></i>
                                    </a>
                                    <form th:action="@{'/admin/companies/' + ${c.id} + '/delete'}" method="post" onsubmit="return confirm('Are you sure you want to delete this company and all its historical drives?');">
                                        <button type="submit" class="btn btn-sm btn-outline-danger py-1 px-2" title="Delete">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>
</body>
</html>
