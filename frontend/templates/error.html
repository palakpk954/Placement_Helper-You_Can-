<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: html}">
<head>
    <title>Something Went Wrong — You_can</title>
</head>
<body>
<div th:fragment="content">
    <div class="container py-5 text-center" style="max-width: 600px;">
        <div class="app-card p-5 shadow-sm border-0">
            <div class="display-3 text-warning mb-3">
                <i class="bi bi-exclamation-triangle-fill"></i>
            </div>
            <h3 class="fw-bold mb-2">Something Went Wrong</h3>
            <p class="text-muted mb-4">
                The application encountered an unexpected issue while processing your request. Please return to the dashboard or try again.
            </p>
            <div class="d-flex flex-wrap justify-content-center gap-2">
                <a th:href="@{/admin}" sec:authorize="hasRole('ADMIN')" class="btn btn-danger rounded-pill px-4 shadow-xs">
                    <i class="bi bi-shield-lock me-1"></i> Admin Dashboard
                </a>
                <a th:href="@{/alumni/dashboard}" sec:authorize="hasRole('ALUMNI')" class="btn btn-primary rounded-pill px-4 shadow-xs">
                    <i class="bi bi-mortarboard me-1"></i> Mentor Cockpit
                </a>
                <a th:href="@{/dashboard}" sec:authorize="!hasRole('ADMIN') and !hasRole('ALUMNI')" class="btn btn-primary rounded-pill px-4 shadow-xs">
                    <i class="bi bi-speedometer2 me-1"></i> Student Dashboard
                </a>
                <a href="javascript:history.back()" class="btn btn-outline-secondary rounded-pill px-4">
                    Go Back
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
