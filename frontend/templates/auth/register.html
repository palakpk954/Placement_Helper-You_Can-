<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration — You_can JECRC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="d-flex align-items-center justify-content-center py-5" style="min-height: 100vh; background: radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.08) 0%, rgba(168, 29, 34, 0.06) 90%);">

    <div class="container" style="max-width: 540px;">
        <!-- Logo / Title -->
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-4 shadow-sm mb-2" style="width: 3.5rem; height: 3.5rem;">
                <i class="bi bi-mortarboard-fill fs-2"></i>
            </div>
            <h2 class="brand-font fw-bold mb-1">Create Student Account</h2>
            <div class="text-muted small">JECRC UNIVERSITY PLACEMENT PORTAL</div>
        </div>

        <!-- Registration Card -->
        <div class="app-card p-4 p-sm-5 shadow-lg">
            <div class="alert alert-danger py-2 small" th:if="${errorMessage}" th:text="${errorMessage}">Error message</div>

            <form th:action="@{/register}" method="post">
                <div class="mb-3">
                    <label class="form-label small fw-semibold" for="regEmail">University Email Address</label>
                    <input type="email" class="form-control" id="regEmail" name="email" placeholder="rollno@jecrcu.edu.in" required>
                    <div class="form-text small">Must end with @jecrcu.edu.in or @university.edu</div>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold" for="fullName">Full Name</label>
                    <input type="text" class="form-control" id="fullName" name="fullName" placeholder="e.g. Rahul Sharma" required>
                </div>

                <div class="row g-2 mb-3">
                    <div class="col-sm-6">
                        <label class="form-label small fw-semibold" for="branch">Degree / Branch</label>
                        <select class="form-select" id="branch" name="branch" required>
                            <option value="CSE" selected>B.Tech CSE</option>
                            <option value="IT">B.Tech IT</option>
                            <option value="ECE">B.Tech ECE</option>
                            <option value="EE">B.Tech EE</option>
                            <option value="ME">B.Tech Mechanical</option>
                            <option value="Civil">B.Tech Civil</option>
                            <option value="MCA">MCA</option>
                            <option value="BCA">BCA</option>
                        </select>
                    </div>
                    <div class="col-sm-6">
                        <label class="form-label small fw-semibold" for="gradYear">Graduation Year</label>
                        <select class="form-select" id="gradYear" name="graduationYear" required>
                            <option value="2027">2027 (2nd Year)</option>
                            <option value="2026" selected>2026 (Pre-final)</option>
                            <option value="2025">2025 (Final Year)</option>
                            <option value="2024">2024 (Alumni)</option>
                        </select>
                    </div>
                </div>

                <div class="row g-2 mb-3">
                    <div class="col-sm-6">
                        <label class="form-label small fw-semibold" for="cgpa">Current CGPA</label>
                        <input type="number" step="0.01" min="0.0" max="10.0" class="form-control" id="cgpa" name="cgpa" placeholder="e.g. 8.25" value="7.50" required>
                    </div>
                    <div class="col-sm-6">
                        <label class="form-label small fw-semibold" for="backlogs">Active Backlogs</label>
                        <input type="number" min="0" max="10" class="form-control" id="backlogs" name="activeBacklogs" value="0" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-semibold" for="regPassword">Create Password</label>
                    <input type="password" class="form-control" id="regPassword" name="password" placeholder="Minimum 6 characters" minlength="6" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Register Account</button>
            </form>

            <div class="text-center mt-4 text-muted small">
                Already registered? <a th:href="@{/login}" class="fw-semibold">Sign in here</a>
            </div>
        </div>
    </div>

    <script th:src="@{/js/app.js}"></script>
</body>
</html>
