<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — You_can JECRC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="d-flex align-items-center justify-content-center py-5" style="min-height: 100vh; background: radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.08) 0%, rgba(168, 29, 34, 0.06) 90%);">

    <div class="container" style="max-width: 440px;">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-4 shadow-sm mb-2" style="width: 3.5rem; height: 3.5rem;">
                <i class="bi bi-key-fill fs-2"></i>
            </div>
            <h2 class="brand-font fw-bold mb-1">Reset Password</h2>
            <div class="text-muted small">JECRC UNIVERSITY PLACEMENT PORTAL</div>
        </div>

        <div class="app-card p-4 p-sm-5 shadow-lg">
            <p class="text-muted small mb-4">Enter your registered university email address to receive password recovery instructions.</p>

            <form th:action="@{/forgot-password}" method="post">
                <div class="mb-4">
                    <label class="form-label small fw-semibold" for="resetEmail">University Email</label>
                    <input type="email" class="form-control" id="resetEmail" name="email" placeholder="name@jecrcu.edu.in" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Send Reset Link</button>
            </form>

            <div class="text-center mt-4 text-muted small">
                Remember your password? <a th:href="@{/login}" class="fw-semibold">Back to Sign In</a>
            </div>
        </div>
    </div>

    <script th:src="@{/js/app.js}"></script>
</body>
</html>
