# ==========================================
# You_can: JECRC University Placement Portal
# Application Configuration
# ==========================================

spring.application.name=You_can
server.port=8080

# ------------------------------------------
# Database Configuration
# Default: H2 in PostgreSQL compatibility mode
# (Seamlessly overridden via SPRING_DATASOURCE_URL in Docker / Production)
# ------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/youcan;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# ------------------------------------------
# JPA & Hibernate
# ------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.open-in-view=true

# ------------------------------------------
# Flyway Database Migration
# ------------------------------------------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ------------------------------------------
# H2 Console (Developer access)
# ------------------------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ------------------------------------------
# Thymeleaf & Web
# ------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ------------------------------------------
# File Uploads (Resumes, CSV, Excel)
# ------------------------------------------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=./uploads/resumes

# ------------------------------------------
# Security & University Domain Validation
# ------------------------------------------
app.security.allowed-domains=jecrcu.edu.in,university.edu
app.security.require-email-verification=false
app.university.name=JECRC University
app.university.short-name=JECRC

# ------------------------------------------
# Mail Configuration (Mock/Console by default)
# ------------------------------------------
spring.mail.host=${SPRING_MAIL_HOST:smtp.example.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:no-reply@jecrcu.edu.in}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# ------------------------------------------
# AI Feature Configuration (Optional)
# ------------------------------------------
app.ai.enabled=${APP_AI_ENABLED:false}
app.ai.api-key=${APP_AI_API_KEY:}
app.ai.model=${APP_AI_MODEL:gemini-1.5-flash}
